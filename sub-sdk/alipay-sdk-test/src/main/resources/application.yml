server:
  # 8080被本机Steam(webhelper)占用，改用18080
  port: 18080

spring:
  application:
    name: rent-app
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO 按本机环境修改数据库地址与库名，先执行 docs/REQ001-DDL.sql 建表
    # characterEncoding须为Java编码名utf8（Connector/J 8自动映射MySQL的utf8mb4），写utf8mb4会导致建连失败
    url: jdbc:mysql://localhost:3306/car_subscription?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"

# 支付宝汽车订阅对接配置（以下TODO项必须填写后才能联调，详见 docs/开发执行手册.md）
alipay:
  rent:
    # SDK自动装配开关：引入SDK依赖后置true，由SDK自动注册AlipayRentClient/AlipayRentConfig
    enabled: true
    # 开放平台应用APPID
    app-id: TODOAPPID
    # 应用私钥（PKCS8一行Base64，不含头尾标记）
    app-private-key: TODAPPPRIVATEKEY
    # 支付宝公钥（公钥模式）
    alipay-public-key: TODOALIPAYPUBLICKEY
    # 沙箱联调改为 https://openapi.alipaydev.com/gateway.do，正式留空即用默认正式网关
    gateway: ""
    # 异主体收单APPID（与app-id一致则不填）
    trade-app-id: ""
    # 冻结/支付异步通知地址（须外网可达，可用内网穿透临时域名）
    freeze-notify-url: https://your-domain/api/v1/callback/alipay/notify
    pay-notify-url: https://your-domain/api/v1/callback/alipay/notify
    # 芝麻服务ID/品类ID（由支付宝BD提供）
    zm-service-id: TODO_ZM_SERVICE_ID
    category-id: TODO_CATEGORY_ID
    # 私域预授权类目 DEPOSIT_CAR_LEASING_PRI；公域留空
    auth-category: ""
    verify-response-sign: false

logging:
  level:
    com.seehoo.rent: debug
